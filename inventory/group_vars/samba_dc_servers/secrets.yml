---
# Tier-1 secrets — path /samba. Source picked by secrets_backend
# (inventory/group_vars/all/secrets.yml): vault (Phase A, default) or
# infisical (Phase B, after playbooks/90-migrate-secrets.yml). Same
# dual-branch pattern as netbox_servers/dns_servers/unifi_servers.
samba_admin_password: >-
  {{ vault_samba_admin_password if secrets_backend == 'vault' else
     (lookup('infisical.vault.read_secrets',
      universal_auth_client_id=infisical_client_id,
      universal_auth_client_secret=infisical_client_secret,
      url=infisical_url, project_id=infisical_project_id,
      env_slug=infisical_env_slug, path='/samba',
      secret_name='SAMBA_ADMIN_PASSWORD')).value }}

# Pre-issued Technitium API token used to push the AD zone/records into the
# Technitium cluster (see defaults/main.yml's technitium_dns_api_url and
# docs/adr/0001-external-dns-via-technitium.md) — a named, non-expiring token
# created on the Technitium side (technitium_dns_create_api_token in
# ansible-role-technitium-dns), not this role's own credential.
technitium_dns_api_token: >-
  {{ vault_technitium_dns_api_token if secrets_backend == 'vault' else
     (lookup('infisical.vault.read_secrets',
      universal_auth_client_id=infisical_client_id,
      universal_auth_client_secret=infisical_client_secret,
      url=infisical_url, project_id=infisical_project_id,
      env_slug=infisical_env_slug, path='/samba',
      secret_name='TECHNITIUM_DNS_API_TOKEN')).value }}
